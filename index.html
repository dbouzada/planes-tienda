<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Planes de Pago</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #0f1117;
  --surface:    #181c27;
  --surface2:   #1e2436;
  --border:     #252c3f;
  --accent:     #4f7eff;
  --text:       #e8ecf4;
  --text-dim:   #6b788f;
  --text-muted: #363f55;
  --green:      #22c55e;
  --green-bg:   rgba(34,197,94,.10);
  --red:        #f43f5e;
  --red-bg:     rgba(244,63,94,.10);
  --yellow:     #f59e0b;
  --r:          14px;
  --rs:         9px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
.hd {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  background: rgba(15,17,23,.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.hd-left { display: flex; align-items: center; gap: 10px; }
.hd-logo { font-size: 20px; }
.hd-title { font-size: 15px; font-weight: 600; letter-spacing: -.3px; }
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-muted); transition: background .4s;
  flex-shrink: 0;
}
.sync-dot.ok      { background: var(--green); }
.sync-dot.err     { background: var(--red); }
.sync-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* BODY */
.wrap { padding: 22px 16px 80px; max-width: 460px; margin: 0 auto; }

.sect-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .6px;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 9px;
}

/* IMPORTE */
.imp-box {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  display: flex; align-items: center;
  padding: 0 16px;
  margin-bottom: 28px;
  transition: border-color .2s;
}
.imp-box:focus-within { border-color: var(--accent); }
.imp-sym {
  font-family: 'DM Mono', monospace;
  font-size: 26px; font-weight: 400;
  color: var(--text-dim); margin-right: 6px; flex-shrink: 0;
}
.imp-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'DM Mono', monospace;
  font-size: 32px; font-weight: 500;
  color: var(--text); padding: 15px 0;
  width: 100%; -webkit-appearance: none;
}
.imp-input::placeholder { color: var(--text-muted); }

/* PLANES */
.planes { display: flex; flex-direction: column; gap: 10px; }

.plan {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.plan.descuento { border-color: rgba(34,197,94,.25); }
.plan.recargo   { border-color: rgba(244,63,94,.15); }
.plan.neutro    { border-color: rgba(79,126,255,.20); }

.plan-top {
  display: flex; align-items: center;
  padding: 12px 14px; gap: 10px;
}
.plan-icon { font-size: 18px; flex-shrink: 0; }
.plan-info { flex: 1; min-width: 0; }
.plan-name {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plan-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.plan-badge {
  font-family: 'DM Mono', monospace;
  font-size: 12px; font-weight: 500;
  padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
}
.plan-badge.desc { background: var(--green-bg); color: var(--green); }
.plan-badge.rec  { background: var(--red-bg);   color: var(--red); }
.plan-badge.neu  { background: rgba(79,126,255,.12); color: var(--accent); }

.plan-bottom {
  border-top: 1px solid var(--border);
  padding: 11px 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.plan-bottom-label { font-size: 11px; color: var(--text-dim); }
.plan-total {
  font-family: 'DM Mono', monospace;
  font-size: 22px; font-weight: 500; letter-spacing: -.5px;
}
.plan-total.desc { color: var(--green); }
.plan-total.rec  { color: var(--text); }
.plan-total.neu  { color: var(--accent); }
.plan-cuota {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: var(--text-dim);
  margin-top: 3px; text-align: right;
}

/* EMPTY */
.empty {
  text-align: center; padding: 52px 24px;
  color: var(--text-dim); font-size: 14px; line-height: 1.6;
}
.empty-icon { font-size: 40px; margin-bottom: 14px; opacity: .45; }

/* MSG */
.msg { text-align: center; padding: 36px 24px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }
.msg-icon { font-size: 30px; margin-bottom: 10px; }
.msg small { display: block; color: var(--text-muted); margin-top: 6px; font-size: 12px; }

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 16px env(safe-area-inset-bottom, 10px);
  background: rgba(15,17,23,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.btn {
  flex: 1;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  border-radius: 30px; padding: 10px 0;
  border: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s, transform .1s;
}
.btn:active { opacity: .8; transform: scale(.97); }
.btn-refresh {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.btn-share {
  background: var(--accent);
  color: #fff;
  display: none;
}
.btn-share.visible { display: block; }
</style>
</head>
<body>

<div class="hd">
  <div class="hd-left">
    <span class="hd-logo">👗</span>
    <span class="hd-title">Planes de Pago</span>
  </div>
  <div class="sync-dot loading" id="syncDot"></div>
</div>

<div class="wrap">
  <div class="sect-label">Importe</div>
  <div class="imp-box">
    <span class="imp-sym">$</span>
    <input
      class="imp-input"
      id="importe"
      type="number"
      inputmode="numeric"
      placeholder="0"
      min="0"
      step="1"
      oninput="calcPlanes()"
    >
  </div>

  <div class="sect-label">Planes disponibles</div>
  <div id="planes" class="planes">
    <div class="msg"><div class="msg-icon">⏳</div>Cargando planes…</div>
  </div>
</div>

<div class="footer">
  <button class="btn btn-refresh" onclick="cargarPlanes()">↻ Actualizar planes</button>
  <button class="btn btn-share" id="btnShare" onclick="compartir()">Compartir</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPlyGrh6cPmcxVz7o0XQ9_3Vte2-K8L3MOaklbpd62XEWY73R7FlqzJYysIWrf2_ds/exec';

let planes = [];

// Arrancar
cargarPlanes();

async function cargarPlanes() {
  setSyncDot('loading');
  document.getElementById('planes').innerHTML =
    '<div class="msg"><div class="msg-icon">⏳</div>Cargando planes…</div>';
  document.getElementById('btnShare').classList.remove('visible');

  try {
    const res = await fetch(SCRIPT_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.planes || !json.planes.length) throw new Error('Sin datos en el sheet');
    planes = json.planes;
    setSyncDot('ok');
    calcPlanes();
  } catch (e) {
    setSyncDot('err');
    document.getElementById('planes').innerHTML = `
      <div class="msg">
        <div class="msg-icon">⚠️</div>
        No se pudo cargar los planes.
        <small>${e.message}</small>
      </div>`;
  }
}

function calcPlanes() {
  const importe = parseFloat(document.getElementById('importe').value) || 0;
  const cont = document.getElementById('planes');
  const btnShare = document.getElementById('btnShare');

  if (!planes.length) return;

  if (importe <= 0) {
    btnShare.classList.remove('visible');
    cont.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💰</div>
        Ingresá un importe para ver los planes disponibles
      </div>`;
    return;
  }

  btnShare.classList.add('visible');

  cont.innerHTML = planes.map(p => {
    const total = importe * (1 + p.coef / 100);
    const tipo  = p.coef < 0 ? 'desc' : p.coef === 0 ? 'neu' : 'rec';
    const clase = p.coef < 0 ? 'descuento' : p.coef === 0 ? 'neutro' : 'recargo';
    const icon  = p.coef < 0 ? '✅' : p.coef === 0 ? '💳' : '📋';
    const badge = p.coef < 0 ? `${p.coef}%` : p.coef === 0 ? 'Sin recargo' : `+${p.coef}%`;

    const cuotasMatch = p.obs.match(/(\d+)\s*cu[eo]/i);
    const cuotaLine = cuotasMatch
      ? `<div class="plan-cuota">≈ $${fmt(total / parseInt(cuotasMatch[1]))} x cuota</div>`
      : '';

    return `
      <div class="plan ${clase}">
        <div class="plan-top">
          <span class="plan-icon">${icon}</span>
          <div class="plan-info">
            <div class="plan-name">${p.obs || 'Plan ' + p.codigo}</div>
            <div class="plan-sub">Código ${p.codigo}</div>
          </div>
          <span class="plan-badge ${tipo}">${badge}</span>
        </div>
        <div class="plan-bottom">
          <div class="plan-bottom-label">Total a pagar</div>
          <div>
            <div class="plan-total ${tipo}">$${fmt(total)}</div>
            ${cuotaLine}
          </div>
        </div>
      </div>`;
  }).join('');
}

function compartir() {
  const importe = parseFloat(document.getElementById('importe').value) || 0;
  if (!importe || !planes.length) return;

  const lines = planes.map(p => {
    const total = importe * (1 + p.coef / 100);
    const cuotasMatch = p.obs.match(/(\d+)\s*cu[eo]/i);
    const cuotaStr = cuotasMatch
      ? ` (≈ $${fmt(total / parseInt(cuotasMatch[1]))} x cuota)`
      : '';
    return `• ${p.obs || 'Plan ' + p.codigo}: $${fmt(total)}${cuotaStr}`;
  }).join('\n');

  const texto = `💳 *Planes de Pago*\nImporte: $${fmt(importe)}\n\n${lines}`;

  if (navigator.share) {
    navigator.share({ text: texto }).catch(() => {});
  } else {
    navigator.clipboard.writeText(texto)
      .then(() => alert('¡Copiado al portapapeles!'))
      .catch(() => alert(texto));
  }
}

function setSyncDot(state) {
  document.getElementById('syncDot').className = `sync-dot ${state}`;
}

function fmt(n) {
  return Number(n).toLocaleString('es-AR', {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
</script>
</body>
</html>
