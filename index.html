<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Andorra Jeans — Planes de Pago</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --surface: #181c27;
      --surface2: #1e2436;
      --surface3: #242b40;
      --border: #252c3f;
      --text: #e8ecf4;
      --text-dim: #6b788f;
      --text-muted: #363f55;
      --shadow: rgba(0, 0, 0, .35);
      --hd-bg: rgba(15, 17, 23, .93);
      --ft-bg: rgba(15, 17, 23, .90);
      --drop-bg: #1e2436;
    }

    :root[data-theme="light"] {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --surface2: #f4f5f9;
      --surface3: #eaecf3;
      --border: #dde1ea;
      --text: #111827;
      --text-dim: #6b7280;
      --text-muted: #b0b7c3;
      --shadow: rgba(0, 0, 0, .07);
      --hd-bg: rgba(240, 242, 247, .93);
      --ft-bg: rgba(240, 242, 247, .90);
      --drop-bg: #ffffff;
    }

    :root {
      --accent: #4f7eff;
      --green: #16a34a;
      --green-bg: rgba(22, 163, 74, .10);
      --red: #e11d48;
      --red-bg: rgba(225, 29, 72, .10);
      --yellow: #f59e0b;
      --r: 14px;
      --rs: 9px;
    }

    :root[data-theme="light"] {
      --green: #15803d;
      --red: #be123c;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
    }

    /* HEADER */
    .hd {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: var(--hd-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      transition: background .25s, border-color .25s;
    }

    .hd-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hd-logo {
      font-size: 20px;
    }

    .hd-brand {
      display: flex;
      flex-direction: column;
    }

    .hd-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.4px;
      line-height: 1.1;
    }

    .hd-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: .2px;
    }

    .hd-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-btn {
      width: 36px;
      height: 20px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      position: relative;
      transition: background .25s, border-color .25s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-btn::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: transform .25s, background .25s;
    }

    [data-theme="light"] .theme-btn::after {
      transform: translateX(16px);
      background: var(--accent);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background .4s;
      flex-shrink: 0;
    }

    .sync-dot.ok {
      background: var(--green);
    }

    .sync-dot.err {
      background: var(--red);
    }

    .sync-dot.loading {
      background: var(--yellow);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .35
      }
    }

    /* WRAP */
    .wrap {
      padding: 22px 16px 100px;
      max-width: 460px;
      margin: 0 auto;
    }

    .sect-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .6px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    /* IMPORTE */
    .imp-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      display: flex;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: border-color .2s, background .25s;
    }

    .imp-box:focus-within {
      border-color: var(--accent);
    }

    .imp-sym {
      font-family: 'DM Mono', monospace;
      font-size: 26px;
      font-weight: 400;
      color: var(--text-dim);
      margin-right: 6px;
      flex-shrink: 0;
    }

    .imp-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 32px;
      font-weight: 500;
      color: var(--text);
      padding: 15px 0;
      width: 100%;
      -webkit-appearance: none;
    }

    .imp-input::placeholder {
      color: var(--text-muted);
    }

    /* SLOTS */
    .slots {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .slot {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      overflow: visible;
      box-shadow: 0 2px 6px var(--shadow);
      transition: border-color .2s, background .25s;
      position: relative;
    }

    .slot.has-plan {
      border-color: var(--accent);
    }

    .slot.has-result.descuento {
      border-color: rgba(22, 163, 74, .35);
    }

    .slot.has-result.recargo {
      border-color: rgba(225, 29, 72, .20);
    }

    .slot.has-result.neutro {
      border-color: rgba(79, 126, 255, .28);
    }

    .slot-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
    }

    .slot-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
      transition: background .2s, color .2s, border-color .2s;
    }

    .slot.has-plan .slot-num {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* SELECTOR */
    .selector-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    .selector-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--rs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 32px 8px 10px;
      outline: none;
      transition: border-color .2s, background .25s;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .selector-input:focus {
      border-color: var(--accent);
    }

    .selector-input::placeholder {
      color: var(--text-muted);
    }

    .selector-arrow {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 11px;
      pointer-events: none;
    }

    /* CLEAR BTN */
    .slot-clear {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s;
    }

    .slot-clear:active {
      background: var(--red-bg);
      color: var(--red);
    }

    .slot.has-plan .slot-clear {
      display: flex;
    }

    /* DROPDOWN */
    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--drop-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--rs);
      overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow);
      display: none;
      max-height: 220px;
      overflow-y: auto;
    }

    .dropdown.open {
      display: block;
    }

    .drop-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background .12s;
      border-bottom: 1px solid var(--border);
    }

    .drop-item:last-child {
      border-bottom: none;
    }

    .drop-item:active,
    .drop-item:hover {
      background: var(--surface2);
    }

    .drop-item-name {
      font-weight: 500;
    }

    .drop-item-code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .drop-item-badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .drop-item-badge.desc {
      background: var(--green-bg);
      color: var(--green);
    }

    .drop-item-badge.rec {
      background: var(--red-bg);
      color: var(--red);
    }

    .drop-item-badge.neu {
      background: rgba(79, 126, 255, .12);
      color: var(--accent);
    }

    .drop-empty {
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* RESULTADO DEL SLOT */
    .slot-result {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      transition: border-color .25s;
    }

    .slot.has-result .slot-result {
      display: flex;
    }

    .slot-result-label {
      font-size: 11px;
      color: var(--text-dim);
    }

    .slot-result-ahorro {
      font-size: 11px;
      font-weight: 500;
      color: var(--green);
      margin-top: 2px;
    }

    .slot-result-total {
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.5px;
      text-align: right;
    }

    .slot-result-total.desc {
      color: var(--green);
    }

    .slot-result-total.rec {
      color: var(--text);
    }

    .slot-result-total.neu {
      color: var(--accent);
    }

    .slot-result-cuota {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
      text-align: right;
    }

    /* BTN CALCULAR */
    .btn-calc {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s, transform .1s;
      opacity: .4;
      pointer-events: none;
    }

    .btn-calc.active {
      opacity: 1;
      pointer-events: all;
    }

    .btn-calc:active {
      transform: scale(.98);
      opacity: .85;
    }

    /* MSG */
    .msg {
      text-align: center;
      padding: 20px 24px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .msg-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .msg small {
      display: block;
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 12px;
    }

    /* FOOTER */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px env(safe-area-inset-bottom, 10px);
      background: var(--ft-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      transition: background .25s, border-color .25s;
    }

    .btn-footer {
      flex: 1;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 30px;
      padding: 10px 0;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s, transform .1s;
    }

    .btn-footer:active {
      opacity: .8;
      transform: scale(.97);
    }

    .btn-refresh {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .btn-share {
      background: var(--accent);
      color: #fff;
      display: none;
    }

    .btn-share.visible {
      display: block;
    }
  </style>
</head>

<body>

  <div class="hd">
    <div class="hd-left">
      <span class="hd-logo">👖</span>
      <div class="hd-brand">
        <span class="hd-title">Andorra Jeans</span>
        <span class="hd-sub">Planes de pago</span>
      </div>
    </div>
    <div class="hd-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Cambiar tema"></button>
      <div class="sync-dot loading" id="syncDot"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="sect-label">Importe</div>
    <div class="imp-box">
      <span class="imp-sym">$</span>
      <input class="imp-input" id="importe" type="number" inputmode="numeric" placeholder="0" min="0" step="1"
        oninput="onImporteChange()">
    </div>

    <div class="sect-label">Seleccioná los planes</div>
    <div class="slots" id="slots"></div>

    <button class="btn-calc" id="btnCalc" onclick="calcular()">Calcular</button>

    <div id="msgArea"></div>
  </div>

  <div class="footer">
    <button class="btn-footer btn-refresh" onclick="recargarPlanes()">↻ Actualizar</button>
    <button class="btn-footer btn-share" id="btnShare" onclick="compartir()">Compartir 📤</button>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJ7Zet0uzfFHvOBHfydo5tujEkMyJFtmL2BoKBUVnUyvGr-9E2rLZeDKYN364zAN7V/exec';
    const N_SLOTS = 4;

    let todosLosPlanes = [];   // datos del sheet
    let seleccion = [null, null, null, null];  // plan elegido por slot
    let resultados = [null, null, null, null];  // totales calculados
    let dropdownAbierto = -1;

    // ── TEMA ─────────────────────────────────────────────────────────────────────
    const savedTheme = localStorage.getItem('aj-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('aj-theme', next);
    }

    // ── INIT ─────────────────────────────────────────────────────────────────────
    document.addEventListener('click', e => {
      if (!e.target.closest('.selector-wrap')) cerrarDropdowns();
    });

    cargarPlanes();

    async function cargarPlanes() {
      setSyncDot('loading');
      try {
        const res = await fetch(SCRIPT_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (!json.planes?.length) throw new Error('Sin datos en el sheet');
        todosLosPlanes = json.planes;
        setSyncDot('ok');
        renderSlots();
      } catch (e) {
        setSyncDot('err');
        document.getElementById('slots').innerHTML =
          `<div class="msg"><div class="msg-icon">⚠️</div>No se pudo cargar los planes.<small>${e.message}</small></div>`;
      }
    }

    async function recargarPlanes() {
      seleccion = [null, null, null, null];
      resultados = [null, null, null, null];
      document.getElementById('btnShare').classList.remove('visible');
      await cargarPlanes();
    }

    // ── RENDER SLOTS ──────────────────────────────────────────────────────────────
    function renderSlots() {
      const cont = document.getElementById('slots');
      cont.innerHTML = Array.from({ length: N_SLOTS }, (_, i) => `
    <div class="slot" id="slot-${i}">
      <div class="slot-header">
        <div class="slot-num">${i + 1}</div>
        <div class="selector-wrap">
          <input
            class="selector-input"
            id="search-${i}"
            type="text"
            placeholder="Buscar plan…"
            autocomplete="off"
            readonly
            onfocus="abrirDropdown(${i})"
            oninput="filtrarDropdown(${i})"
          >
          <span class="selector-arrow">▾</span>
          <div class="dropdown" id="drop-${i}"></div>
        </div>
        <button class="slot-clear" onclick="limpiarSlot(${i})">✕</button>
      </div>
      <div class="slot-result" id="result-${i}">
        <div>
          <div class="slot-result-label">Total a pagar</div>
          <div class="slot-result-ahorro" id="ahorro-${i}"></div>
        </div>
        <div>
          <div class="slot-result-total" id="total-${i}"></div>
          <div class="slot-result-cuota" id="cuota-${i}"></div>
        </div>
      </div>
    </div>
  `).join('');
      actualizarBtnCalc();
    }

    // ── DROPDOWN ──────────────────────────────────────────────────────────────────
    function abrirDropdown(idx) {
      // hacer editable para buscar
      const input = document.getElementById(`search-${idx}`);
      input.removeAttribute('readonly');
      input.value = '';
      renderDropdown(idx, '');
      document.getElementById(`drop-${idx}`).classList.add('open');
      dropdownAbierto = idx;
    }

    function cerrarDropdowns() {
      for (let i = 0; i < N_SLOTS; i++) {
        const drop = document.getElementById(`drop-${i}`);
        const input = document.getElementById(`search-${i}`);
        if (drop) drop.classList.remove('open');
        if (input) {
          input.setAttribute('readonly', true);
          // restaurar texto del plan seleccionado
          if (seleccion[i]) input.value = seleccion[i].obs || 'Plan ' + seleccion[i].codigo;
          else input.value = '';
        }
      }
      dropdownAbierto = -1;
    }

    function filtrarDropdown(idx) {
      const q = document.getElementById(`search-${idx}`).value;
      renderDropdown(idx, q);
    }

    function renderDropdown(idx, query) {
      const drop = document.getElementById(`drop-${idx}`);
      // planes ya seleccionados en OTROS slots
      const usados = seleccion
        .map((s, i) => i !== idx && s ? s.codigo : null)
        .filter(Boolean);

      const q = query.toLowerCase();
      const disponibles = todosLosPlanes.filter(p => {
        if (usados.includes(p.codigo)) return false;
        if (!q) return true;
        return (p.obs || '').toLowerCase().includes(q) ||
          String(p.codigo).includes(q);
      });

      if (!disponibles.length) {
        drop.innerHTML = '<div class="drop-empty">Sin resultados</div>';
        return;
      }

      drop.innerHTML = disponibles.map(p => {
        const tipo = p.coef < 0 ? 'desc' : p.coef === 0 ? 'neu' : 'rec';
        const badge = p.coef < 0 ? `${p.coef}%` : p.coef === 0 ? '0%' : `+${p.coef}%`;
        return `
      <div class="drop-item" onclick="elegirPlan(${idx}, '${p.codigo}')">
        <div>
          <div class="drop-item-name">${p.obs || 'Plan ' + p.codigo}</div>
          <div class="drop-item-code">Cód. ${p.codigo}</div>
        </div>
        <span class="drop-item-badge ${tipo}">${badge}</span>
      </div>`;
      }).join('');
    }

    function elegirPlan(idx, codigo) {
      const plan = todosLosPlanes.find(p => String(p.codigo) === String(codigo));
      if (!plan) return;

      seleccion[idx] = plan;
      resultados[idx] = null;

      const slot = document.getElementById(`slot-${idx}`);
      const input = document.getElementById(`search-${idx}`);

      input.value = plan.obs || 'Plan ' + plan.codigo;
      input.setAttribute('readonly', true);
      slot.classList.add('has-plan');
      slot.classList.remove('has-result', 'descuento', 'recargo', 'neutro');
      document.getElementById(`result-${idx}`).style.display = 'none';

      cerrarDropdowns();
      actualizarBtnCalc();
      // si ya hay importe, recalcular este slot
      const imp = parseFloat(document.getElementById('importe').value) || 0;
      if (imp > 0) calcularSlot(idx, imp);
    }

    function limpiarSlot(idx) {
      seleccion[idx] = null;
      resultados[idx] = null;

      const slot = document.getElementById(`slot-${idx}`);
      const input = document.getElementById(`search-${idx}`);

      input.value = '';
      slot.classList.remove('has-plan', 'has-result', 'descuento', 'recargo', 'neutro');
      document.getElementById(`result-${idx}`).style.display = 'none';

      actualizarBtnCalc();
      document.getElementById('btnShare').classList.remove('visible');
    }

    // ── CALCULAR ──────────────────────────────────────────────────────────────────
    function onImporteChange() {
      // si ya hay resultados, resetearlos
      resultados = [null, null, null, null];
      for (let i = 0; i < N_SLOTS; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.classList.remove('has-result', 'descuento', 'recargo', 'neutro');
        document.getElementById(`result-${i}`).style.display = 'none';
      }
      document.getElementById('btnShare').classList.remove('visible');
      actualizarBtnCalc();
    }

    function calcular() {
      const imp = parseFloat(document.getElementById('importe').value) || 0;
      if (imp <= 0) return;
      let alguno = false;
      for (let i = 0; i < N_SLOTS; i++) {
        if (seleccion[i]) { calcularSlot(i, imp); alguno = true; }
      }
      if (alguno) document.getElementById('btnShare').classList.add('visible');
    }

    function calcularSlot(idx, importe) {
      const p = seleccion[idx];
      if (!p) return;
      const total = importe * (1 + p.coef / 100);
      resultados[idx] = total;

      const tipo = p.coef < 0 ? 'desc' : p.coef === 0 ? 'neu' : 'rec';
      const clase = p.coef < 0 ? 'descuento' : p.coef === 0 ? 'neutro' : 'recargo';

      const cuotasMatch = p.obs.match(/(\d+)\s*(?:ctas?|cuotas?)/i);
      document.getElementById(`total-${idx}`).textContent = `$${fmt(total)}`;
      document.getElementById(`total-${idx}`).className = `slot-result-total ${tipo}`;
      document.getElementById(`cuota-${idx}`).textContent = cuotasMatch
        ? `≈ $${fmt(total / parseInt(cuotasMatch[1]))} x cuota` : '';
      document.getElementById(`ahorro-${idx}`).textContent = p.coef < 0
        ? `Ahorrás $${fmt(importe - total)}` : '';

      const slot = document.getElementById(`slot-${idx}`);
      const result = document.getElementById(`result-${idx}`);
      slot.classList.add('has-result', clase);
      result.style.display = 'flex';
    }

    // ── COMPARTIR ──────────────────────────────────────────────────────────────────
    function compartir() {
      const imp = parseFloat(document.getElementById('importe').value) || 0;
      if (!imp) return;

      const lines = seleccion.map((p, i) => {
        if (!p || resultados[i] === null) return null;
        const total = resultados[i];
        const cuotasMatch = p.obs.match(/(\d+)\s*(?:ctas?|cuotas?)/i);
        const cuotaStr = cuotasMatch ? ` (≈ $${fmt(total / parseInt(cuotasMatch[1]))} x cuota)` : '';
        const ahorroStr = p.coef < 0 ? ` — ahorrás $${fmt(imp - total)}` : '';
        return `• ${p.obs || 'Plan ' + p.codigo}: *$${fmt(total)}*${cuotaStr}${ahorroStr}`;
      }).filter(Boolean).join('\n');

      const texto = `👖 *Andorra Jeans — Planes de Pago*\nImporte: $${fmt(imp)}\n\n${lines}`;

      if (navigator.share) {
        navigator.share({ text: texto }).catch(() => { });
      } else {
        navigator.clipboard.writeText(texto)
          .then(() => alert('¡Copiado al portapapeles!'))
          .catch(() => alert(texto));
      }
    }

    // ── UTILS ─────────────────────────────────────────────────────────────────────
    function actualizarBtnCalc() {
      const imp = parseFloat(document.getElementById('importe').value) || 0;
      const alguno = seleccion.some(s => s !== null);
      const btn = document.getElementById('btnCalc');
      btn.classList.toggle('active', imp > 0 && alguno);
    }

    function setSyncDot(state) {
      document.getElementById('syncDot').className = `sync-dot ${state}`;
    }
    function fmt(n) {
      return Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
  </script>
</body>
